services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zipcrypt
      POSTGRES_USER: zipcrypt
      POSTGRES_PASSWORD: zipcrypt
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zipcrypt -d zipcrypt"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zipcrypt
      MINIO_ROOT_PASSWORD: zipcrypt-local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
